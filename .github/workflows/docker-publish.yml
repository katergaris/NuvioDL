name: Pubblica immagine Docker

# Build automatica dell'immagine ad ogni push su main, pubblicata su GitHub
# Container Registry: e' l'immagine che CasaOS (e chiunque altro) scarica
# gia' pronta, senza dover clonare o compilare nulla sul proprio NAS.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nome immagine (minuscolo, richiesto da Docker)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/nuviodl" >> "$GITHUB_OUTPUT"

      - name: Login su GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imposta QEMU (build multi-piattaforma)
        uses: docker/setup-qemu-action@v3

      - name: Imposta Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
